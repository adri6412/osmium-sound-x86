# Per-image platform configuration for the x86 build.
# Read at import by core/hifi_platform.py into the process environment
# (os.environ.setdefault), so an explicit env var still wins. KEY=VALUE only.
# x86 is the canonical default: the baked-in defaults in the app code already
# target x86 (Cloudflare Pages / R2, hifi-image- prefix), so only the platform
# marker is set here.
HIFI_PLATFORM=x86
